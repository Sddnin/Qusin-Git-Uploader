name: Android CI Build (Qusin Git Uploader)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Ensure debug.keystore exists for CI debug signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Debug APK exists
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: app/build/outputs/apk/debug/app-debug.apk not found!"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qusin-Git-Uploader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Check optional release signing secrets
        id: check_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Optional Signed Release Build (when keystore secrets are configured)
        if: steps.check_signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          export KEYSTORE_PATH="$PWD/upload-keystore.jks"
          ./gradlew assembleRelease --no-daemon
          rm -f upload-keystore.jks

      - name: Upload Release APK Artifact (optional)
        if: steps.check_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Qusin-Git-Uploader-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NAME="${VERSION_NAME:-1.0}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Qusin-Git-Uploader-${RELEASE_TAG}-debug.apk"
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" 2>/dev/null | head -n1 || true)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "release-assets/Qusin-Git-Uploader-${RELEASE_TAG}-release.apk"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.apk \
              --target "${GITHUB_SHA}" \
              --title "Qusin Git Uploader ${RELEASE_TAG}" \
              --generate-notes
          fi
